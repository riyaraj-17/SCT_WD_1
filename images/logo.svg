<svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="500" height="300" fill="none"/>
  
  <!-- Flame icon - Red, Orange, Yellow -->
  <g transform="translate(250, 140)">
    <!-- Outer flame - RED -->
    <path d="M0,60 C-25,35 -35,0 -15,-30 C-5,-45 -2,-60 0,-80 C2,-60 5,-45 15,-30 C35,0 25,35 0,60Z" 
          stroke="#ff0000" stroke-width="4" fill="none" opacity="0.8"/>
    
    <!-- Middle flame - ORANGE -->
    <path d="M0,55 C-20,32 -28,5 -12,-25 C-4,-38 -1,-52 0,-70 C1,-52 4,-38 12,-25 C28,5 20,32 0,55Z" 
          stroke="#ff6600" stroke-width="3" fill="none" opacity="0.7"/>
    
    <!-- Inner flame - YELLOW -->
    <path d="M0,45 C-15,25 -20,5 -8,-18 C-3,-28 0,-38 0,-55 C0,-38 3,-28 8,-18 C20,5 15,25 0,45Z" 
          stroke="#ffcc00" stroke-width="2.5" fill="none" opacity="0.6"/>
    
    <!-- Embers -->
    <circle cx="-10" cy="-45" r="3" fill="#ff0000" opacity="0.3"/>
    <circle cx="8" cy="-40" r="2.5" fill="#ff6600" opacity="0.25"/>
    <circle cx="-5" cy="-60" r="2" fill="#ffcc00" opacity="0.2"/>
    <circle cx="12" cy="-55" r="1.5" fill="#ff0000" opacity="0.15"/>
    <circle cx="-7" cy="-35" r="1.5" fill="#ff6600" opacity="0.2"/>
  </g>
  
  <!-- Brand name - BLACK -->
  <text x="250" y="230" text-anchor="middle" font-family="'Playfair Display', serif" 
        font-size="32" font-weight="700" fill="#1a1a1a" letter-spacing="8" opacity="0.5">
    BASIL &amp; EMBER
  </text>
  
  <!-- Subtitle - BLACK -->
  <text x="250" y="255" text-anchor="middle" font-family="'Inter', sans-serif" 
        font-size="11" font-weight="600" fill="#1a1a1a" letter-spacing="4" opacity="0.3">
    WOOD-FIRED · INDIAN GRILL
  </text>
</svg>
